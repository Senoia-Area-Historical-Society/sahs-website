name: CI

# Runs on pull requests, deliberately NOT on push to main.
#
# Merging to main *is* the production release (see deploy.yml), so a check
# wired into that path fails after the merge — too late to act on — and would
# let a lint nit block an urgent content fix from shipping. Catching problems
# on the PR is the point where they are still cheap to fix.
on:
  pull_request:

# A new push to the same PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install site dependencies
        run: npm ci

      # Config-only, no secret needed: catches firebase.json or .firebaserc being
      # re-coupled to archive-app's shared Storage bucket. The env-var half of the
      # check is skipped here (the secret is a deploy-time concern) and runs in
      # deploy.yml instead.
      - name: Check Storage bucket target
        run: node scripts/check-storage-bucket-target.cjs

      # Build the site BEFORE installing functions dependencies. The order is the
      # point, not an accident.
      #
      # `npm run build` is `tsc -b && vite build`, and `tsc -b` type-checks src/ —
      # which means it follows imports in src/test/*.test.ts into whatever
      # functions/src/ module they name, and then type-checks THAT module's own
      # imports too. Type-checking is per module, not per imported symbol.
      #
      # deploy.yml installs functions dependencies *after* it builds, so a site test
      # importing a functions module that itself imports `firebase-functions` or
      # `express` fails there with TS2307 — while passing here, if functions/node_modules
      # already exists. That combination is the worst one available: a green PR and a
      # failed deploy on main, nothing released, previous revision left serving. It
      # happened on 2026-09-04 (PR #71).
      #
      # Matching deploy.yml's order makes the PR fail instead.
      - name: Build site (no functions dependencies — mirrors deploy.yml)
        run: npm run build

      - name: Install functions dependencies
        run: npm ci --prefix functions

      # `--max-warnings` is deliberately not set: ~60 pre-existing
      # `no-explicit-any` warnings are tracked as debt, not defects, and are
      # downgraded to warnings in eslint.config.js. This step fails only on
      # genuine errors — unused variables, bad imports, hook rule violations.
      - name: Lint
        run: npm run lint

      - name: Build functions
        run: npm run build --prefix functions

      - name: Unit tests
        run: npx vitest run

      # Authorization tests: firestore.rules and storage.rules, exercised from every
      # seat in the role matrix (anonymous, read_only, board_member, editor, curator,
      # role-granted admin, permanent admin) against the real emulators.
      #
      # This step exists because the September 2026 audit found six defects in the
      # rules and none anywhere else — the pure logic was thoroughly covered while
      # authorization was only ever exercised by clicking the admin UI *as an admin*,
      # the one identity that passes every check. Public volunteer signup had been
      # dead since the day it shipped, and editors could not upload an image at all.
      #
      # Needs a JRE for the Firestore and Storage emulators.
      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Security rules tests
        run: npm run test:rules
